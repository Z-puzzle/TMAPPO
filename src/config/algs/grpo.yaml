name: "grpo"

runner: "episode"

# --- GRPO parameters ---
learner: "grpo_learner"
policy_type: "on_policy"

# Collect K episodes from the same initial state per update.
grpo_group_size: 8
grpo_adv_eps: 1e-8

buffer_size: 8
batch_size: 8
batch_size_run: 1
minibatch_size: 8
ppo_epochs: 4

gamma: 0.99
lr: 0.0001
ent_coef: 0.001
clip_range: 0.1
grad_norm_clip: 10

# --- Agent parameters (match transformer.yaml defaults) ---
mac: "basic_mac"
agent: "transformeragent"
action_selector: "multinomial"
shareparam: True
obs_agent_id: False
obs_last_action: False
mask_before_softmax: False
agent_output_type: "pi_logits"

n_layers: 2
n_heads: 4
model_dim: 64

env_args:
  state_last_action: False

critic_train_reps: 1

