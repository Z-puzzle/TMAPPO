# --- COMA specific parameters ---

action_selector: "multinomial"
epsilon_start: .5
epsilon_finish: .01
epsilon_anneal_time: 600000
mask_before_softmax: False

runner: "episode"

buffer_size: 8
batch_size: 8
batch_size_run: 8

env_args:
  state_last_action: False # critic adds last action internally

# update the target network every {} training steps
target_update_interval: 200

lr: 0.0005
critic_lr: 0.0005
td_lambda: 0.8
agent: "rnn" # Default rnn agent
obs_agent_id: False # Include the agent's one_hot id in the observation
obs_last_action: False # Include the agent's last action (one_hot) in the observation
policy_type: "on_policy"

tau: 2.0   # 灵敏度，越大越平缓
beta_max: 1.0  # 最大偏移比例，建议 0.2~0.5 之间调

# use COMA
agent_output_type: "pi_logits"
learner: "newmethod2_learner"
critic_q_fn: "coma"
critic_baseline_fn: "coma"
critic_train_mode: "seq"
critic_train_reps: 1
q_nstep: 0  # 0 corresponds to default Q, 1 is r + gamma*Q, etc

name: "newmethod2"
